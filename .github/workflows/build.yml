name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      # The race detector needs cgo, which the Windows development machine
      # lacks, so this is the only place it runs.
      - name: Test
        run: go test -race ./...
      - name: Stock QIDI updater fixtures
        run: python3 -B -m unittest discover -s internal/printerlab/migration/tools/migration/tests -p test_qidi_updater.py -v
      - name: Cross-compile
        run: make release
