name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - README.md
      - mkdocs.yml
      - requirements-docs.txt
      - .gitignore
      - .github/workflows/docs.yml
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - README.md
      - mkdocs.yml
      - requirements-docs.txt
      - .gitignore
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: hlab-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      # The race detector needs cgo, which the Windows development machine
      # lacks, so this is the only place it runs.
      - name: Test
        run: go test -race -p 1 -parallel 1 ./...
      - name: Plus4 updater and controller fixtures
        run: |
          python3 -B -m unittest discover -s internal/printerlab/migration/tools/migration/tests -p 'test_qidi_*.py' -v
          python3 -B -m unittest discover -s internal/printerlab/migration/tools/migration/tests -p 'test_box_drying.py' -v
          python3 -B -m unittest discover -s internal/printerlab/migration/tools/migration/tests -p 'test_usb_events.py' -v
          python3 -B -m unittest discover -s internal/printerlab/migration/tools/migration/tests -p 'test_save_variables_fast.py' -v
      - name: Cross-compile
        run: make release
